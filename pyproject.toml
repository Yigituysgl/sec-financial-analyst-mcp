[project]
name = "sec-financial-analyst-mcp"
version = "1.0.2"
description = "MCP server that gives AI assistants source-cited financial analysis of US public companies from SEC EDGAR filings."
readme = "README.md"
authors = [
    { name = "Yigit Uysaloglu" },
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "sec", "edgar", "xbrl", "financial-analysis", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/Yigituysgl/sec-financial-analyst-mcp"
Repository = "https://github.com/Yigituysgl/sec-financial-analyst-mcp"
Issues = "https://github.com/Yigituysgl/sec-financial-analyst-mcp/issues"
Changelog = "https://github.com/Yigituysgl/sec-financial-analyst-mcp/releases"

[project.scripts]
sec-financial-analyst-mcp = "sec_financial_analyst_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]



[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]