[project]
name = "sec-financial-analyst-mcp"
version = "1.0.0"
description = "MCP server that gives AI assistants source-cited financial analysis of US public companies from SEC EDGAR filings."
readme = "README.md"
authors = [
    { name = "Yigit Uysaloglu" },
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sec-financial-analyst-mcp = "sec_financial_analyst_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]



[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]